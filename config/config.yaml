### Reference

# General settings
reference:
  release: 111      # Ensembl release used to download the reference genome and annotation
  nonchr: false     # whether (=true) to include non-chromosomal/scaffold contigs
threads: 30         # maximum number of threads any single rule may use
mapq: 30            # minimum read mapping quality (MAPQ, Phred-scaled)
basequal: 20        # minimum base-call quality (Phred-scaled)

samples: config/samples.tsv   # path to the sample sheet (long format); one row per
                              # (sample, seqtype, group). Columns: sample, seqtype
                              # (dnaseq/rnaseq), group, type (tumor/normal), reads,
                              # custom_variants, custom_proteins, custom_hla_I,
                              # custom_hla_II. See docs/configuration.md.

# resources:                   # 可选：把全部资源改从镜像获取（例如阿里云 OSS），
#   base_url: ""               # 而不用原始公开源
                              # 设置后每条下载规则改取 {base_url}/<path>，不再用规则里
                              # 硬编码的公开 URL。因此镜像必须按相同相对路径存放规则
                              # 需要的**归档文件本身**（不是解压后的产物），例如：
                              #   {base_url}/refs/Homo_sapiens.GRCh38.111.gtf.gz
                              #   {base_url}/vqsr/hapmap_3.3.hg38.vcf.gz
                              #
                              # 用 misc/scripts/pre_download_resources.sh 建镜像：它读取
                              # 上面的 reference.release，每个 release 写一份完整快照。
                              #   --dest   myoss:<bucket>/ScanNeo2/resources/r111
                              #   base_url: https://<bucket>.<endpoint>/ScanNeo2/resources/r111
                              #
                              # 请保留 r<release> 这一段。Ensembl 蛋白质组
                              # （refs/Homo_sapiens.GRCh38.pep.all.fa.gz）和两个 Ensembl
                              # VEP 插件随 release 变化、但文件名里不带 release：平铺前缀
                              # 会在升 reference.release 后静默地继续提供旧版。按 release
                              # 分前缀还能让新版先建好并用 --check 验证、再切换 base_url，
                              # 期间旧版照常服务。每次改 reference.release 都要重跑脚本。
                              #
                              # 镜像若不可公共读取，需要凭据：导出 OSS_ACCESS_KEY_ID /
                              # OSS_ACCESS_KEY_SECRET，下载规则会经
                              # workflow/scripts/fetch_resource.sh 用 SigV4 签名（region
                              # 从 endpoint 主机名解析，可用 OSS_REGION 覆盖）。两个变量
                              # 都没设时走普通 HTTP，公共镜像不受影响。
                              #
                              # 详见 docs/mirror.md

### pre-processing (only applied on fastq reads)
preproc: 
  activate: true  # whether (=true) or not (=false) to include pre-processing
  minlen: 10      # discard reads shorter than this (bp) after trimming
  slidingwindow:
    activate: true
    wsize: 3      # sliding-window size (bp) for quality trimming
    wqual: 20     # mean base quality required within the window (Phred-scaled)

### alignment
# STAR chimeric-alignment parameters (used for RNA-seq gene-fusion detection)
align:
  chimSegmentMin: 20            # minimum length of each chimeric segment (0 disables chimeric detection)
  chimScoreMin: 10              # minimum total score of a chimeric alignment
  chimJunctionOverhangMin: 10   # minimum overhang length for a chimeric junction
  chimScoreDropMax: 30          # maximum allowed drop of chimeric score below read length
  chimScoreSeparation: 10       # minimum score separation between the best and next-best chimeric alignment

### variant calling
# alternative splicing
altsplicing:
  activate: true # whether (=true) or not (=false) to include alternative splicing events
  confidence: 3  # confidence level (1,2 or 3) - filtering of input alignments
  iterations: 5 # number of iteratios (when adding intro edges) - increases sensitivity
  edgelimit: 250  # limit max number of edges in graph - affects the runtime

# exitron splicing
exitronsplicing:
  activate: true # whether (=true) or not (=false) to include exitron-splicing events
  ao: 3  # allele observation
  pso: 0.05  # percent spliced out
  strand: 1 # strand specificity of library (0=unstranded, 1=forward, 2=reverse)

# gene fusion
genefusion:
  activate: true # whether (=true) or not (=false) to include gene fusion events
  maxevalue: 0.3
  suppreads: 2  # all fusions with less than suppreads are discarded
  maxsuppreads: 1000
  maxidentity: 0.3  # genes with fraction of identity are discarded (homologs)
  hpolymerlen: 6  # removes breakpoints adjacent to homopolymers of length
  readthroughdist: 10000  # distance between breakpoints with less than distance
  minanchorlen: 20  # removes fusions whose segments are less than minchimlen
  splicedevents: 4  # fusions between genes need at least this many spliced breakpoints
  maxkmer: 0.6  # remove reads with repetitive 3-mer that make up more than maxkmer
  fraglen: 200 # mean fragment length
  maxmismatch: 0.01

### indel
indel:
  activate: true # whether (=true) or not (=false) to include indels
  type: all # long, short, all
  mode: BOTH  # DNA, RNA or BOTH - 
  # strategy for optimizing posterior probability threshold
  strategy: OPTIMAL_F_SCORE # OPTIMAL_F_SCORE, FALSE_DISCOVERY_RATE, CONSTANT 
  fscorebeta: 1.0  # rel. weight of recall to precision (when OPTIMAL_F_SCORE is selected)
  fdr: 0.05  # false discovery rate (when FALSE_DISCOVERY_RATE is selected)
  sliplen: 8  # min number of reference bases to suspect slippage event
  sliprate: 0.1  # frequency of slippage when it is supsected

quantification:
  mode: BOTH  # quantify expression from DNA, RNA, or BOTH

hlatyping:
  class: BOTH # I, II or BOTH
  MHC-I_mode: DNA, RNA # DNA, RNA, or custom (if empty alleles have to be specified in custom)
  MHC-II_mode: DNA, RNA # DNA, RNA, or custom (if empty alleles have to be specified in custom)

  # HLA-HD reference data (only required when class: II or BOTH)
  freqdata: ./hlahd_files/freq_data/        # HLA-HD frequency-data directory
  split: ./hlahd_files/HLA_gene.split.txt   # HLA-HD gene-split file
  dict: ./hlahd_files/dictionary/           # HLA-HD dictionary directory

prioritization:
  class: I # I, II or BOTH
  lengths:                  # comma-separated epitope lengths (aa) to predict per MHC class
    MHC-I: 8,9,10,11
    MHC-II: 13,14,15

