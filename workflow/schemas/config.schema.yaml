$schema: "http://json-schema.org/draft-07/schema#"
description: ScanNeo2 configuration file schema

type: object

properties:

  reference:
    type: object
    properties:
      release:
        type: integer
        minimum: 1
        description: Ensembl release used to download the reference genome and annotation
      nonchr:
        type: boolean
        description: whether to include non-chromosomal/scaffold contigs
    required: [release, nonchr]
    additionalProperties: false

  threads:
    type: integer
    minimum: 1
    description: maximum number of threads any single rule may use

  mapq:
    type: integer
    minimum: 0
    maximum: 60
    description: minimum read mapping quality (MAPQ)

  basequal:
    type: integer
    minimum: 0
    maximum: 60
    description: minimum base-call quality (Phred-scaled)

  samples:
    type: string
    minLength: 1
    description: path to the sample sheet (TSV) listing one sample per row; see workflow/schemas/samples.schema.yaml

  preproc:
    type: object
    properties:
      activate:
        type: boolean
      minlen:
        type: integer
        minimum: 1
        description: discard reads shorter than this (bp) after trimming
      slidingwindow:
        type: object
        properties:
          activate:
            type: boolean
          wsize:
            type: integer
            minimum: 1
          wqual:
            type: integer
            minimum: 0
            maximum: 60
        required: [activate, wsize, wqual]
        additionalProperties: false
    required: [activate, minlen, slidingwindow]
    additionalProperties: false

  align:
    type: object
    properties:
      chimSegmentMin:
        type: integer
      chimScoreMin:
        type: integer
      chimJunctionOverhangMin:
        type: integer
      chimScoreDropMax:
        type: integer
      chimScoreSeparation:
        type: integer
    required: [chimSegmentMin, chimScoreMin, chimJunctionOverhangMin, chimScoreDropMax, chimScoreSeparation]
    additionalProperties: false

  altsplicing:
    type: object
    properties:
      activate:
        type: boolean
      confidence:
        type: integer
        minimum: 0
        maximum: 3
      iterations:
        type: integer
        minimum: 5
        description: SplAdder iterations to add intron edges; shouldn't be set below 5
      edgelimit:
        type: integer
        minimum: 1
    required: [activate, confidence, iterations, edgelimit]
    additionalProperties: false

  exitronsplicing:
    type: object
    properties:
      activate:
        type: boolean
      ao:
        type: integer
        minimum: 0
      pso:
        type: number
        minimum: 0
        maximum: 1
      strand:
        type: integer
        enum: [0, 1, 2]
        description: library strand specificity (0=unstranded, 1=forward, 2=reverse)
    required: [activate, ao, pso, strand]
    additionalProperties: false

  genefusion:
    type: object
    properties:
      activate:
        type: boolean
      maxevalue:
        type: number
        exclusiveMinimum: 0
        exclusiveMaximum: 1
      suppreads:
        type: integer
        minimum: 0
      maxsuppreads:
        type: integer
        minimum: 1
      maxidentity:
        type: number
        minimum: 0
        maximum: 1
      hpolymerlen:
        type: integer
        minimum: 1
      readthroughdist:
        type: integer
        minimum: 0
      minanchorlen:
        type: integer
        minimum: 1
      splicedevents:
        type: integer
        minimum: 0
      maxkmer:
        type: number
        minimum: 0
        maximum: 1
      fraglen:
        type: integer
        minimum: 1
      maxmismatch:
        type: number
        minimum: 0
        maximum: 1
    required: [activate, maxevalue, suppreads, maxsuppreads, maxidentity, hpolymerlen, readthroughdist, minanchorlen, splicedevents, maxkmer, fraglen, maxmismatch]
    additionalProperties: false

  indel:
    type: object
    properties:
      activate:
        type: boolean
      type:
        type: string
        enum: [long, short, all]
      mode:
        type: string
        enum: [DNA, RNA, BOTH]
      strategy:
        type: string
        enum: [OPTIMAL_F_SCORE, FALSE_DISCOVERY_RATE, CONSTANT]
      fscorebeta:
        type: number
        exclusiveMinimum: 0
      fdr:
        type: number
        exclusiveMinimum: 0
        exclusiveMaximum: 1
      sliplen:
        type: integer
        minimum: 1
      sliprate:
        type: number
        minimum: 0
        maximum: 1
    required: [activate, type, mode, strategy, fscorebeta, fdr, sliplen, sliprate]
    additionalProperties: false

  quantification:
    type: object
    properties:
      mode:
        type: string
        enum: [DNA, RNA, BOTH]
    required: [mode]
    additionalProperties: false

  hlatyping:
    type: object
    properties:
      class:
        type: string
        enum: [I, II, BOTH]
      MHC-I_mode:
        type: string
        description: "DNA, RNA, or custom (comma-separated combinations allowed)"
      MHC-II_mode:
        type: string
      freqdata:
        type: string
      split:
        type: string
      dict:
        type: string
    required: [class, MHC-I_mode, MHC-II_mode, freqdata, split, dict]
    additionalProperties: false

  prioritization:
    type: object
    properties:
      class:
        type: string
        enum: [I, II, BOTH]
      lengths:
        type: object
        properties:
          MHC-I:
            type: string
            description: comma-separated epitope lengths
          MHC-II:
            type: string
        required: [MHC-I, MHC-II]
        additionalProperties: false
    required: [class, lengths]
    additionalProperties: false

  resources:
    type: object
    properties:
      base_url:
        type: string
        minLength: 1
        description: >
          所有工作流资源改从此 URL（例如阿里云 OSS 的桶 endpoint）获取，而不用它们
          原始的公开源。未设置或为空时，每条下载规则回退到规则里硬编码的公开 URL。
          base_url 下的文件布局必须与本地 resources/ 目录树对应，例如
          ``base_url: "https://example.oss-cn-hangzhou.aliyuncs.com/prefix"``：
            * ``{base_url}/refs/Homo_sapiens.GRCh38.dna_sm.primary_assembly.fa.gz``
              （对应 gzip 解压后的 ``resources/refs/genome.fasta``）
            * ``{base_url}/vqsr/hapmap_3.3.hg38.vcf.gz``
              （对应 ``resources/vqsr/hapmap_3.3.hg38.vcf.gz``）
          提示：用 ``misc/scripts/pre_download_resources.sh`` 建镜像，它读取
          ``reference.release`` 并按 release 写一份完整快照，例如 ``--dest
          <remote>:<bucket>/ScanNeo2/resources/r111`` 配合 ``base_url:
          "https://<bucket>.<endpoint>/ScanNeo2/resources/r111"``。请保留那个
          ``r<release>`` 段：Ensembl 蛋白质组和两个 Ensembl VEP 插件随 release 变化、
          但文件名里不带 release，平铺前缀会在升 ``reference.release`` 后静默提供旧版。
          按 release 分前缀还能让新版先建好并用 ``--check`` 验证、再切换 ``base_url``。
          每次改 ``reference.release`` 都要重跑脚本，然后切换 ``base_url``。
          详见 ``docs/mirror.md``。
    additionalProperties: false

required:
  - reference
  - threads
  - mapq
  - basequal
  - samples
  - preproc
  - align
  - altsplicing
  - exitronsplicing
  - genefusion
  - indel
  - quantification
  - hlatyping
  - prioritization
additionalProperties: false
